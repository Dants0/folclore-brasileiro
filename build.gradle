plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			vmArgs "-Xmx1536m"
		}
	}

	mods {
		"folclore" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	// The automated in-game test script is for development only.
	exclude 'com/guilhermegoes/folclore/client/Roteiro*'
}

sourcesJar {
	exclude 'com/guilhermegoes/folclore/client/Roteiro*'
}

// Runs the built jar the way a player's launcher does (no dev classes, no test script):
// ./gradlew prodClient. Catches mistakes that only show up in the published jar.
configurations { prodMods { transitive = false } }
dependencies { prodMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}" }

tasks.register("prodClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	dependsOn tasks.named("jar")
	if (!project.hasProperty("semFolclore")) mods.from(tasks.named("jar"))
	mods.from(configurations.prodMods)
	jvmArgs.add("-Xmx1536m")
	runDir = file("run-prod")
}
